<header class="flex flex-none items-center justify-between">
  <div class="flex min-w-0 items-center gap-2">
    @if (history.canReturn(returnTarget)) {
      <button
        pButton
        type="button"
        [pTooltip]="'ACTIONS.BACK' | translate"
        tooltipPosition="bottom"
        severity="secondary"
        iconOnly
        [text]="true"
        [attr.aria-label]="'ACTIONS.BACK' | translate"
        (click)="history.back(returnTarget)"
      >
        <i class="pi pi-arrow-left"></i>
      </button>
    }
    <h1 class="min-w-0 truncate text-2xl font-bold">{{ 'FILES.MACHINE_TITLE' | translate }} {{ machine().name }}</h1>
  </div>
  <div class="flex items-center gap-2">
    @if (store.canUpload()) {
      <button
        pButton
        [pTooltip]="'FILES.TOOLTIPS.UPLOAD_MACHINE' | translate"
        tooltipPosition="bottom"
        type="button"
        (click)="store.requestUpload()"
      >
        <i class="pi pi-upload"></i>
        {{ 'FILES.UPLOAD' | translate }}
      </button>
    }
  </div>
</header>
<hf-file-grid
  [showMachineColumn]="false"
  [access]="store.rowAccess()"
  [rows]="page().items"
  [totalCount]="page().totalCount"
  [isLoading]="store.files.isLoading()"
  [refreshSecondsLeft]="store.refreshSecondsLeft()"
  (refreshRequested)="store.refresh()"
  [hasLoaded]="store.files.hasValue()"
  [columns]="store.visibleColumns()"
  [offset]="store.offset()"
  [limit]="store.limit()"
  [sort]="store.sort()"
  [filter]="store.filter()"
  [canDelete]="store.canDelete()"
  (filterChange)="store.setFilter($event)"
  (sortChange)="store.setSort($event)"
  (pageChange)="store.setPage($event.offset, $event.limit)"
  (columnsChange)="store.setColumns($event)"
  (columnsReorder)="store.reorderColumns($event)"
  (downloadRequested)="store.download($event)"
  (editRequested)="store.requestEdit($event)"
  (deleteRequested)="store.requestDelete($event)"
  (rowActionRequested)="store.requestRowAction($event)"
/>
