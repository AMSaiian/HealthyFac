<hf-action-dialog
  [title]="store.isUpdate() ? 'MACHINES.FORM.UPDATE_TITLE' : 'MACHINES.FORM.CREATE_TITLE'"
  [isSaveDisabled]="saveDisabledReason() !== null"
  [saveDisabledReason]="saveDisabledReason()"
  [isSaving]="store.isSaving()"
  (save)="onSave()"
  (cancelled)="store.cancel()"
>
  @if (startValue(); as initial) {
    <hf-machine-form
      [initialValue]="initial"
      [isUpdate]="store.isUpdate()"
      [gatewayId]="store.gatewayId()"
      [departments]="employee.departmentOptions()"
      [isDepartmentsLoading]="employee.departments.isLoading()"
      (valueChange)="onValueChange($event)"
      (validityChange)="onValidityChange($event)"
    />
  } @else {
    <div class="flex min-h-48">
      <hf-loading-spinner />
    </div>
  }
  @if (store.isSaving()) {
    <div class="absolute inset-0 flex bg-surface-0/60 dark:bg-surface-900/60">
      <hf-loading-spinner />
    </div>
  }
</hf-action-dialog>
