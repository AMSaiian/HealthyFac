<hf-action-dialog
  [title]="title()"
  [isSaveDisabled]="saveDisabledReason() !== null"
  [saveDisabledReason]="saveDisabledReason()"
  [isSaving]="store.isSaving()"
  [isSaveShown]="store.isEditMode()"
  [isEditShown]="store.isEditShown()"
  [hasEditCancel]="store.isUpdate() && store.isEditMode()"
  (save)="onSave()"
  (editRequested)="onEdit()"
  (editCancelled)="store.cancelEdit()"
  (cancelled)="store.cancel()"
>
  @if (store.prefilledValue(); as initial) {
    @if (store.isViewMode()) {
      <hf-machine-details
        [value]="initial"
        [gatewayId]="store.gatewayId()"
        [descriptionLinks]="store.descriptionLinks()"
      />
    } @else {
      <hf-machine-form
        [initialValue]="initial"
        [isUpdate]="store.isUpdate()"
        [gatewayId]="store.gatewayId()"
        [minGoLiveOn]="store.minGoLiveOn()"
        (valueChange)="onValueChange($event)"
        (validityChange)="onValidityChange($event)"
      />
    }
  } @else {
    <div class="flex min-h-48">
      @if (showSpinner()) {
        <hf-loading-spinner />
      }
    </div>
  }
  @if (showSaving()) {
    <div class="absolute inset-0 flex bg-surface-0/60 dark:bg-surface-900/60">
      <hf-loading-spinner />
    </div>
  }
</hf-action-dialog>
