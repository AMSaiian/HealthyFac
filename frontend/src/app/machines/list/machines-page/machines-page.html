<header class="flex flex-none items-center justify-between">
  <h1 class="text-2xl font-bold">{{ 'MACHINES.TITLE' | translate }}</h1>
  <div class="flex items-center gap-2">
    @if (store.canWrite()) {
      <button
        pButton
        [pTooltip]="'MACHINES.TOOLTIPS.ADD_NEW' | translate"
        tooltipPosition="bottom"
        type="button"
        (click)="store.requestCreate()"
      >
        <i class="pi pi-plus"></i>
        {{ 'MACHINES.ADD_NEW' | translate }}
      </button>
    }
  </div>
</header>
<hf-machine-grid
  [rows]="page().items"
  [totalCount]="page().totalCount"
  [isLoading]="store.machines.isLoading()"
  [hasLoaded]="store.machines.hasValue()"
  [columns]="store.visibleColumns()"
  [offset]="store.offset()"
  [limit]="store.limit()"
  [sort]="store.sort()"
  [filter]="store.filter()"
  [canWrite]="store.canWrite()"
  [canDelete]="store.canDelete()"
  [canReadStatuses]="store.canReadStatuses()"
  [canReadFiles]="store.canReadFiles()"
  [canReadMetrics]="store.canReadMetrics()"
  [canReadDrafts]="store.canReadDrafts()"
  (filterChange)="store.setFilter($event)"
  (sortChange)="store.setSort($event)"
  (pageChange)="store.setPage($event.offset, $event.limit)"
  (columnsChange)="store.setColumns($event)"
  (columnsReorder)="store.reorderColumns($event)"
  (updateRequested)="store.requestUpdate($event)"
  (deleteRequested)="store.requestDelete($event)"
  (statusesRequested)="store.openStatuses($event)"
  (filesRequested)="store.openFiles($event)"
  (metricsRequested)="store.openMetrics($event)"
  (draftsRequested)="store.requestDrafts($event)"
/>
