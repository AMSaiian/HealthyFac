<header class="flex flex-none items-center justify-between">
  <h1 class="text-2xl font-bold">{{ 'FILES.TITLE' | translate }}</h1>
  <div class="flex items-center gap-2">
    @if (store.canUpload()) {
      <button
        pButton
        type="button"
        (click)="store.requestUpload()"
      >
        <i class="pi pi-upload"></i>
        {{ 'FILES.UPLOAD' | translate }}
      </button>
    }
  </div>
</header>
<hf-file-grid
  [rows]="page().items"
  [totalCount]="page().totalCount"
  [isLoading]="store.files.isLoading()"
  [columns]="store.visibleColumns()"
  [offset]="store.offset()"
  [limit]="store.limit()"
  [sort]="store.sort()"
  [filter]="store.filter()"
  [canEdit]="store.canEdit()"
  [canDelete]="store.canDelete()"
  (filterChange)="store.setFilter($event)"
  (sortChange)="store.setSort($event)"
  (pageChange)="store.setPage($event.offset, $event.limit)"
  (columnsChange)="store.setColumns($event)"
  (columnsReorder)="store.reorderColumns($event)"
  (downloadRequested)="store.download($event)"
  (editRequested)="store.requestEdit($event)"
  (deleteRequested)="store.requestDelete($event)"
/>
