<hf-machine-drafts-host
  titleKey="INGEST.SUMMARY.TITLE"
  [action]="action()"
>
  @if (store.isNotFound()) {
    <p class="text-muted-color">{{ 'INGEST.SUMMARY.NOT_FOUND' | translate }}</p>
  }
  @if (store.reasonKey(); as reasonKey) {
    <p class="text-red-500">{{ reasonKey | translate }}</p>
  }
  @if (store.warning(); as warning) {
    <p class="text-orange-500">{{ warning.key | translate: warningValues() }}</p>
  }
</hf-machine-drafts-host>
