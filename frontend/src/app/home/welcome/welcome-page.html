@if (store.isIntroVisible()) {
  <p-card class="m-4 block">
    <p class="mb-4">{{ 'HOME.INTRO' | translate }}</p>
    <button
      pButton
      [pTooltip]="'HOME.TOOLTIPS.DISMISS' | translate"
      tooltipPosition="bottom"
      type="button"
      (click)="store.dismissIntro()"
    >
      {{ 'HOME.DISMISS' | translate }}
    </button>
  </p-card>
}
