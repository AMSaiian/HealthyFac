<header class="flex flex-none items-center justify-between">
  <h1 class="text-2xl font-bold">{{ 'MAINTENANCE.TITLE' | translate }}</h1>
</header>
<hf-cases-grid
  [rows]="page().items"
  [totalCount]="page().totalCount"
  [isLoading]="store.cases.isLoading()"
  [refreshSecondsLeft]="store.refreshSecondsLeft()"
  (refreshRequested)="store.refresh()"
  [hasLoaded]="store.cases.hasValue()"
  [columns]="store.visibleColumns()"
  [offset]="store.offset()"
  [limit]="store.limit()"
  [sort]="store.sort()"
  [filter]="store.filter()"
  [machineLabels]="store.machineLabels()"
  [machines]="store.machineLookup.options()"
  [isMachinesLoading]="store.machineLookup.isLoading()"
  (machineLookupRequested)="store.machineLookup.request($event)"
  (filterChange)="store.setFilter($event)"
  (sortChange)="store.setSort($event)"
  (pageChange)="store.setPage($event.offset, $event.limit)"
  (columnsChange)="store.setColumns($event)"
  (columnsReorder)="store.reorderColumns($event)"
  (openRequested)="store.openCase($event)"
/>
