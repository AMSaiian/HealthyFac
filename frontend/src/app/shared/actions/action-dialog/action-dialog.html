<p-dialog
  [styleClass]="widthClass()"
  [contentStyle]="{ 'max-height': '70vh', 'overflow-y': 'auto' }"
  appendTo="body"
  [modal]="true"
  [draggable]="false"
  [closeOnEscape]="!isSaving() && !isClosedByHeaderOnly()"
  [header]="title() | translate"
  [(visible)]="isVisible"
  (onHide)="cancelled.emit()"
>
  <div class="relative p-1">
    <ng-content />
  </div>
  <ng-template #footer>
    <ng-content select="[hfDialogFooter]" />
    @if (isSaveShown()) {
      <span
        [pTooltip]="saveDisabledReason() ? (saveDisabledReason()! | translate) : ''"
        [tooltipDisabled]="!isSaveDisabled() || saveDisabledReason() === null"
      >
        <button
          pButton
          type="button"
          [disabled]="isSaveDisabled() || isSaving()"
          (click)="save.emit()"
        >
          {{ 'ACTIONS.SAVE' | translate }}
        </button>
      </span>
    }
    @if (!isClosedByHeaderOnly()) {
      <button
        pButton
        type="button"
        severity="secondary"
        [disabled]="isSaving()"
        (click)="cancelled.emit()"
      >
        {{ (isSaveShown() ? 'ACTIONS.CANCEL' : 'ACTIONS.CLOSE') | translate }}
      </button>
    }
  </ng-template>
</p-dialog>
