<p-dialog
  [styleClass]="rootClass()"
  [contentStyle]="contentStyle()"
  appendTo="body"
  [modal]="true"
  [draggable]="false"
  [pt]="hiddenClosePt"
  [dismissableMask]="!isSaving()"
  [closeOnEscape]="false"
  [header]="title() | translate"
  [(visible)]="isVisible"
  (onHide)="cancelled.emit()"
>
  <div [class]="bodyClass()">
    <ng-content />
  </div>
  <ng-template #footer>
    <button
      pButton
      [pTooltip]="(isSaveShown() ? 'ACTIONS.TOOLTIPS.CANCEL' : 'ACTIONS.TOOLTIPS.CLOSE') | translate"
      tooltipPosition="bottom"
      type="button"
      severity="secondary"
      [disabled]="isSaving()"
      (click)="cancelled.emit()"
    >
      {{ (isSaveShown() ? 'ACTIONS.CANCEL' : 'ACTIONS.CLOSE') | translate }}
    </button>
    <ng-content select="[hfDialogFooter]" />
    @if (isSaveShown()) {
      <span
        [pTooltip]="saveDisabledReason() ? (saveDisabledReason()! | translate: saveDisabledReasonParams()) : ''"
        [tooltipDisabled]="!isSaveDisabled() || saveDisabledReason() === null"
      >
        <button
          pButton
          [pTooltip]="'ACTIONS.TOOLTIPS.SAVE' | translate"
          tooltipPosition="bottom"
          type="button"
          [disabled]="isSaveDisabled() || isSaving()"
          (click)="save.emit()"
        >
          {{ 'ACTIONS.SAVE' | translate }}
        </button>
      </span>
    }
  </ng-template>
</p-dialog>
