<div class="flex items-baseline gap-1">
  <span
    #textElement
    class="line-clamp-2 min-w-0 wrap-anywhere whitespace-normal"
    [class.line-through]="isStruck()"
    [pTooltip]="text()"
    tooltipPosition="bottom"
    [tooltipDisabled]="!isCut()"
    >{{ text() }}</span
  >
  <ng-content />
</div>
