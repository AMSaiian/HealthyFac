<div
  cdkDropList
  cdkDropListSortingDisabled
  class="flex flex-col items-start gap-2 p-1"
>
  @for (card of cards(); track card.item.id) {
    <div
      cdkDrag
      cdkDragPreviewContainer="global"
      class="hf-status-backlog rounded-border flex max-w-full min-w-12 flex-none cursor-grab items-stretch overflow-hidden text-xs leading-6 text-white"
      role="button"
      tabindex="0"
      [style.width.px]="card.previewWidthPx"
      [style.height.rem]="laneHeightRem"
      [attr.aria-label]="card.tooltip"
      [pTooltip]="card.tooltip"
      tooltipPosition="left"
      tooltipStyleClass="whitespace-pre-line"
      [tooltipDisabled]="isDragging()"
      (cdkDragStarted)="onDragStarted()"
      (cdkDragMoved)="dragMoved.emit($event.pointerPosition)"
      (cdkDragEnded)="onDragEnded($event, card.item.id)"
      (click)="onClick(card.item.id)"
      (keydown.enter)="onClick(card.item.id)"
    >
      <span
        class="w-1.5 flex-none"
        [class]="card.item.priorityClass"
      ></span>
      <span class="w-0 min-w-0 flex-1 truncate px-2">{{ card.item.title }}</span>
      <ng-template cdkDragPreview>
        <div
          class="hf-status-backlog rounded-border -mt-3 truncate px-2 text-xs leading-6 text-white shadow-lg"
          [style.height.rem]="laneHeightRem"
          [style.width.px]="card.previewWidthPx"
          [style.margin-left.px]="-card.previewWidthPx / 2"
        >
          {{ card.item.title }}
        </div>
      </ng-template>
    </div>
  } @empty {
    <p class="text-muted-color p-3 text-sm">{{ 'WORK_ORDERS.SCHEDULE_TAB.STAGING_EMPTY' | translate }}</p>
  }
</div>
@if (isMoreAvailable()) {
  <p class="text-muted-color flex-none px-3 py-2 text-sm">
    {{ 'WORK_ORDERS.SCHEDULE_TAB.MORE' | translate: { count: workOrders().length, total: totalCount() } }}
  </p>
}
