<p-datepicker
  [appendTo]="appendTo()"
  [ngModel]="pickerValue()"
  [minDate]="minDate()"
  [maxDate]="maxDate()"
  [invalid]="invalid()"
  [disabled]="disabled()"
  [readonlyInput]="readonly()"
  [showTime]="true"
  [stepMinute]="stepMinute()"
  hourFormat="24"
  (ngModelChange)="onPickerChange($event)"
  (onBlur)="touch.emit()"
/>
