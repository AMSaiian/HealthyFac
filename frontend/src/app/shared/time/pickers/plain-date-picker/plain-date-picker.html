<p-datepicker
  [appendTo]="appendTo()"
  [ngModel]="pickerValue()"
  [minDate]="minDate()"
  [maxDate]="maxDate()"
  [invalid]="invalid()"
  [disabled]="disabled()"
  [readonlyInput]="readonly()"
  hourFormat="24"
  (ngModelChange)="onPickerChange($event)"
  (onBlur)="touch.emit()"
  (onMonthChange)="onViewChange($event)"
  (onYearChange)="onViewChange($event)"
  (onShow)="shown.emit()"
>
  @if (dateTemplate(); as template) {
    <ng-template
      #date
      let-date
    >
      <ng-container
        [ngTemplateOutlet]="template"
        [ngTemplateOutletContext]="{ $implicit: date }"
      />
    </ng-template>
  }
</p-datepicker>
