<hf-assignment-picker
  [estimateMinutes]="estimateMinutes()"
  [employees]="employees()"
  [isEmployeesLoading]="isEmployeesLoading()"
  [days]="days()"
  [isDaysLoading]="isDaysLoading()"
  [spans]="spans()"
  [isSpansLoading]="isSpansLoading()"
  [today]="today()"
  [initialValue]="initialValue()"
  (valueChange)="onValue($event)"
  (employeeLookupRequested)="employeeLookupRequested.emit($event)"
  (daysRequested)="daysRequested.emit($event)"
  (spansRequested)="spansRequested.emit($event)"
/>
