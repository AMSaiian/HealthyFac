<header class="flex flex-wrap items-center justify-between gap-2">
  <h1 class="text-2xl font-bold">{{ 'WORK_ORDERS.TITLE' | translate }}</h1>
  <div class="flex items-center gap-2">
    <nav
      class="flex items-center gap-1"
      [attr.aria-label]="'WORK_ORDERS.VIEW.LABEL' | translate"
    >
      <a
        pButton
        severity="secondary"
        routerLink="/work-orders"
        [outlined]="activeView() !== 'grid'"
        >{{ 'WORK_ORDERS.VIEW.GRID' | translate }}</a
      >
      <a
        pButton
        severity="secondary"
        routerLink="/work-orders/board"
        [outlined]="activeView() !== 'board'"
        >{{ 'WORK_ORDERS.VIEW.BOARD' | translate }}</a
      >
    </nav>
    @if (canCreate()) {
      <button
        pButton
        type="button"
        (click)="createRequested.emit()"
      >
        <i class="pi pi-plus"></i>
        {{ 'WORK_ORDERS.ADD_NEW' | translate }}
      </button>
    }
  </div>
</header>
