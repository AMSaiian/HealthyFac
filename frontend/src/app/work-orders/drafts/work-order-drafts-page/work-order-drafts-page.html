<header class="flex flex-none items-center justify-between">
  <div class="flex items-center gap-2">
    <a
      pButton
      [pTooltip]="'WORK_ORDER_DRAFTS.TOOLTIPS.BACK' | translate"
      tooltipPosition="bottom"
      routerLink="/work-orders"
      severity="secondary"
      iconOnly
      [text]="true"
      [attr.aria-label]="'WORK_ORDER_DRAFTS.TOOLTIPS.BACK' | translate"
    >
      <i class="pi pi-arrow-left"></i>
    </a>
    <h1 class="text-2xl font-bold">{{ 'WORK_ORDER_DRAFTS.TITLE' | translate }}</h1>
  </div>
</header>
<hf-work-order-drafts-grid
  [rows]="page().items"
  [totalCount]="page().totalCount"
  [isLoading]="store.drafts.isLoading()"
  [hasLoaded]="store.drafts.hasValue()"
  [columns]="store.visibleColumns()"
  [offset]="store.offset()"
  [limit]="store.limit()"
  [sort]="store.sort()"
  [filter]="store.filter()"
  [canApply]="store.canApply()"
  [canDismiss]="store.canDismiss()"
  (filterChange)="store.setFilter($event)"
  (sortChange)="store.setSort($event)"
  (pageChange)="store.setPage($event.offset, $event.limit)"
  (columnsChange)="store.setColumns($event)"
  (columnsReorder)="store.reorderColumns($event)"
  (applyRequested)="store.requestApply($event)"
  (dismissRequested)="store.requestDismiss($event)"
/>
@if (store.editedDraft(); as draft) {
  <hf-draft-apply-dialog
    [draft]="draft"
    [isSaving]="store.isSaving()"
    (applyRequested)="store.apply($event)"
    (cancelled)="store.closeEditor()"
  />
}
