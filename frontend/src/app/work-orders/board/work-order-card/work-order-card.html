<article
  class="hf-list-item bg-surface-0 dark:bg-surface-900 flex h-full min-w-0 flex-col gap-1 shadow-sm"
  [class.border-red-500]="row().isDelayed"
>
  <div class="flex min-w-0 items-center gap-2">
    <p-tag
      class="flex-none"
      [class]="'hf-priority-' + row().priority"
      [value]="priorityLabel()"
    />
    @if (row().machineName) {
      <span
        class="text-muted-color min-w-0 truncate text-xs"
        [attr.title]="row().machineName"
        >{{ row().machineName }}</span
      >
    }
    @if (row().isDelayed) {
      <i
        class="pi pi-exclamation-circle flex-none text-red-500"
        [attr.aria-label]="'WORK_ORDERS.DELAYED' | translate"
        [pTooltip]="'WORK_ORDERS.DELAYED' | translate"
      ></i>
    }
    @if (canChangeStatus()) {
      <button
        pButton
        [pTooltip]="'WORK_ORDERS.BOARD.CHANGE_STATUS' | translate"
        tooltipPosition="bottom"
        type="button"
        iconOnly
        size="small"
        severity="secondary"
        class="ml-auto flex-none"
        [text]="true"
        [attr.aria-label]="'WORK_ORDERS.BOARD.CHANGE_STATUS' | translate"
        (click)="chooser.toggle($event)"
      >
        <i class="pi pi-flag"></i>
      </button>
      <p-popover
        #chooser
        class="contents"
        appendTo="body"
      >
        <div class="flex min-w-48 flex-col gap-2">
          <span class="text-muted-color text-xs font-bold">{{ 'WORK_ORDERS.BOARD.CHANGE_STATUS' | translate }}</span>
          <p-listbox
            class="hf-option-list"
            [options]="targets()"
            (onChange)="chooser.hide(); choose($event.value)"
          >
            <ng-template
              #item
              let-target
            >
              <div
                class="flex items-center"
                [pTooltip]="'WORK_ORDERS.TOOLTIPS.CHANGE_TO_STATUS' | translate"
              >
                <p-tag
                  [class]="'hf-status-' + target"
                  [value]="statusLabel(target)"
                />
              </div>
            </ng-template>
          </p-listbox>
        </div>
      </p-popover>
    }
  </div>
  <button
    type="button"
    class="text-primary min-w-0 flex-none cursor-pointer truncate text-left font-bold hover:underline"
    [attr.title]="row().title"
    (click)="opened.emit(row().id)"
  >
    {{ row().title }}
  </button>
  <div class="text-muted-color flex items-center justify-between gap-2 text-xs">
    <span class="min-w-0 truncate">{{ canManage() && row().assigneeName ? row().assigneeName : '' }}</span>
    <span class="flex-none">{{ row().plannedStartUtc ? (row().plannedStartUtc | localDateTime) : '' }}</span>
  </div>
</article>
