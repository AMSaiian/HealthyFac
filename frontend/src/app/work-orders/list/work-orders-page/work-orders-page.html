<hf-work-orders-view-header
  activeView="grid"
  [canCreate]="store.canWrite()"
  (createRequested)="store.requestCreate()"
/>
<hf-work-order-grid
  [rows]="page().items"
  [totalCount]="page().totalCount"
  [isLoading]="store.workOrders.isLoading()"
  [columns]="store.visibleColumns()"
  [offset]="store.offset()"
  [limit]="store.limit()"
  [sort]="store.sort()"
  [filter]="store.filter()"
  [canWrite]="store.canWrite()"
  [canManage]="store.canManage()"
  [employees]="store.employeeLookup.options()"
  [machines]="store.machineLookup.options()"
  [isEmployeesLoading]="store.employeeLookup.isLoading()"
  [isMachinesLoading]="store.machineLookup.isLoading()"
  (filterChange)="store.setFilter($event)"
  (sortChange)="store.setSort($event)"
  (pageChange)="store.setPage($event.offset, $event.limit)"
  (columnsChange)="store.setColumns($event)"
  (columnsReorder)="store.reorderColumns($event)"
  (openRequested)="store.requestOpen($event)"
  (actionRequested)="store.requestRowAction($event.type, $event.row)"
  (employeeLookupRequested)="store.employeeLookup.request($event)"
  (machineLookupRequested)="store.machineLookup.request($event)"
/>
