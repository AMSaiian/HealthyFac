<p-card styleClass="text-center">
  <div class="flex flex-col items-center gap-4">
    <i class="pi pi-wifi text-6xl text-primary"></i>
    <h1 class="text-2xl font-bold">{{ 'TITLES.NETWORK_ERROR' | translate }}</h1>
    <p class="text-muted-color">{{ 'NETWORK_ERROR.MESSAGE' | translate }}</p>
    <div class="flex flex-wrap items-center justify-center gap-2">
      <button
        pButton
        type="button"
        severity="secondary"
        [pTooltip]="'ACTIONS.BACK' | translate"
        tooltipPosition="bottom"
        (click)="history.back(returnTarget)"
      >
        {{ 'ACTIONS.BACK' | translate }}
      </button>
      <button
        pButton
        type="button"
        [pTooltip]="'ACTIONS.RETRY' | translate"
        tooltipPosition="bottom"
        (click)="retry()"
      >
        {{ 'ACTIONS.RETRY' | translate }}
      </button>
    </div>
  </div>
</p-card>
