name: healthyfac

services:
  postgres:
    container_name: healthyfac-postgres
    image: postgres:18.6-alpine
    restart: unless-stopped
    user: postgres
    stop_signal: SIGINT
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-healthyfac_core}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 expects a single mount at /var/lib/postgresql, not at the data subdirectory.
      # It then places the cluster in a major-version subdirectory, which keeps pg_upgrade workable.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    container_name: healthyfac-keycloak
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    # The import only creates the realm and the supervisor with the fixed ID on a fresh database, because only the import
    # keeps a fixed user ID. The import skips a realm that exists. The keycloak-config job applies everything else.
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # The public URL is the auth name of the gateway (api., auth., and app. names are in docs/architecture.md).
      # KC_HOSTNAME_BACKCHANNEL_DYNAMIC lets services read the metadata from the
      # internal address, and the metadata then holds internal back-channel URLs such as the JWKS URI.
      KC_HOSTNAME: ${HEALTHYFAC_AUTH_URL:-https://auth.healthyfac.test}
      # The admin console stays on the local port. The gateway has no route to it.
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      # Keycloak replaces each placeholder of the bootstrap file with the variable of the same name.
      HEALTHYFAC_TEST_SUPERVISOR_IDENTITY_ID: ${HEALTHYFAC_TEST_SUPERVISOR_IDENTITY_ID:?set HEALTHYFAC_TEST_SUPERVISOR_IDENTITY_ID in .env}
      HEALTHYFAC_TEST_SUPERVISOR_EMAIL: ${HEALTHYFAC_TEST_SUPERVISOR_EMAIL:?set HEALTHYFAC_TEST_SUPERVISOR_EMAIL in .env}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    # The image has no curl. Bash opens a TCP connection to the management port and reads the readiness answer.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # The job applies docker/keycloak/realm/healthyfac-realm.json and then docker/keycloak/dev/healthyfac-test-tenant.json
  # to the running Keycloak and exits. It changes only the differences. After you change a file, run
  # `docker compose up keycloak-config`.
  keycloak-config:
    container_name: healthyfac-keycloak-config
    image: adorsys/keycloak-config-cli:6.5.1-26
    restart: "no"
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    stop_signal: SIGTERM
    stop_grace_period: 30s
    volumes:
      - ./docker/keycloak/realm:/config/realm:ro
      - ./docker/keycloak/dev:/config/dev:ro
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      IMPORT_FILES_LOCATIONS: /config/realm/healthyfac-realm.json,/config/dev/healthyfac-test-tenant.json
      # The files hold the plain placeholder ${NAME}, which Keycloak also reads in the bootstrap import. The job
      # leaves the Keycloak message placeholders (${username}) unchanged. The option no longer stops on a missing
      # variable; the ":?" checks below stop Compose instead.
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_VARSUBSTITUTION_PREFIX: $${
      IMPORT_VARSUBSTITUTION_SUFFIX: "}"
      IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR: "false"
      # Auth adds employees to the organization at run time. By default the job removes the members and organizations
      # that the files do not list.
      IMPORT_MANAGED_ORGANIZATION: no-delete
      # Auth maps realm roles to users at run time. By default the job removes the roles of a listed user (the
      # supervisor) that the file does not list.
      IMPORT_USERS_MERGEROLES: "true"
      HEALTHYFAC_SPA_URL: ${HEALTHYFAC_SPA_URL:-https://app.healthyfac.test:4200}
      HEALTHYFAC_TEST_COMPANY_ID: ${HEALTHYFAC_TEST_COMPANY_ID:?set HEALTHYFAC_TEST_COMPANY_ID in .env}
      HEALTHYFAC_TEST_SUPERVISOR_IDENTITY_ID: ${HEALTHYFAC_TEST_SUPERVISOR_IDENTITY_ID:?set HEALTHYFAC_TEST_SUPERVISOR_IDENTITY_ID in .env}
      HEALTHYFAC_TEST_SUPERVISOR_EMPLOYEE_ID: ${HEALTHYFAC_TEST_SUPERVISOR_EMPLOYEE_ID:?set HEALTHYFAC_TEST_SUPERVISOR_EMPLOYEE_ID in .env}
      HEALTHYFAC_TEST_SUPERVISOR_EMAIL: ${HEALTHYFAC_TEST_SUPERVISOR_EMAIL:?set HEALTHYFAC_TEST_SUPERVISOR_EMAIL in .env}
      HEALTHYFAC_TEST_SUPERVISOR_PASSWORD: ${HEALTHYFAC_TEST_SUPERVISOR_PASSWORD:?set HEALTHYFAC_TEST_SUPERVISOR_PASSWORD in .env}
      KEYCLOAK_AUTH_CLIENT_SECRET: ${KEYCLOAK_AUTH_CLIENT_SECRET:?set KEYCLOAK_AUTH_CLIENT_SECRET in .env}
      KEYCLOAK_CORE_CLIENT_SECRET: ${KEYCLOAK_CORE_CLIENT_SECRET:?set KEYCLOAK_CORE_CLIENT_SECRET in .env}
      KEYCLOAK_TELEMETRY_CLIENT_SECRET: ${KEYCLOAK_TELEMETRY_CLIENT_SECRET:?set KEYCLOAK_TELEMETRY_CLIENT_SECRET in .env}
    depends_on:
      keycloak:
        condition: service_healthy

  redis:
    container_name: healthyfac-redis
    image: redis:8.10.1-alpine
    restart: unless-stopped
    user: redis
    read_only: true
    # Redis reads its config from stdin. The password then stays out of the process arguments, and the read-only
    # root file system needs no config file.
    command:
      - sh
      - -c
      - |
        exec redis-server - <<EOF
        requirepass $$REDIS_PASSWORD
        save ""
        appendonly no
        EOF
    stop_signal: SIGTERM
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No volume: every key expires or can be rebuilt, so Redis keeps no data across restarts.
    tmpfs:
      - /data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    container_name: healthyfac-rabbitmq
    image: rabbitmq:4.3.5-management-alpine
    restart: unless-stopped
    user: rabbitmq
    read_only: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/log/rabbitmq:rw,noexec,nosuid,uid=100,gid=101,size=64m
      - /etc/rabbitmq/conf.d:rw,noexec,nosuid,uid=100,gid=101,size=1m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  mailpit:
    container_name: healthyfac-mailpit
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    stop_signal: SIGTERM
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Mailpit catches every email in development and keeps the messages in the mailpit-data volume across restarts.
    # `docker compose down -v` removes them. The image has no /data directory, and a new volume at /data belongs to
    # root, so Mailpit (user 65534) gets "permission denied" there. The volume mounts at /tmp instead: the image
    # directory /tmp has mode 1777, and Docker copies that mode into a new named volume, so user 65534 can write.
    environment:
      MP_DATABASE: /tmp/mailpit.db
    volumes:
      - mailpit-data:/tmp
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  core:
    container_name: healthyfac-core
    build:
      context: ./backend
      dockerfile: src/Core/HealthyFac.Core.Web/Dockerfile
    image: healthyfac/core:local
    restart: unless-stopped
    read_only: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - core-logs:/app/logs
      # The seed data file (company name, supervisor name, seed machines). Core reads it in Development only.
      - ./backend/seed:/app/seed:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-healthyfac_core};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      IdEncryption__Keys__0__Prefix: ${IdEncryption__Keys__0__Prefix:-v1.}
      IdEncryption__Keys__0__Key: ${IdEncryption__Keys__0__Key:?set IdEncryption__Keys__0__Key in .env}
      IdEncryption__Keys__0__IsDefault: "true"
      InviteTokens__LifetimeHours: ${InviteTokens__LifetimeHours:-72}
      InviteTokens__Keys__0__Id: ${InviteTokens__Keys__0__Id:-k1}
      InviteTokens__Keys__0__Secret: ${InviteTokens__Keys__0__Secret:?set InviteTokens__Keys__0__Secret in .env}
      InviteTokens__Keys__0__IsDefault: "true"
      ConnectionStrings__RabbitMq: >-
        amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      Messaging__QueueName: core
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__Security: None
      Smtp__FromAddress: ${Smtp__FromAddress:-no-reply@healthyfac.local}
      Smtp__FromName: ${Smtp__FromName:-HealthyFac}
      InviteLinks__SpaBaseUrl: ${HEALTHYFAC_SPA_URL:-https://app.healthyfac.test:4200}
      # The issuer is the public URL of the realm (the gateway). Core reads the metadata and the signing keys from
      # the internal address of Keycloak.
      Jwt__Issuer: ${HEALTHYFAC_AUTH_URL:-https://auth.healthyfac.test}/realms/healthyfac
      Jwt__MetadataAddress: http://keycloak:8080/realms/healthyfac/.well-known/openid-configuration
      Jwt__IsHttpsMetadataRequired: "false"
      # The test company and supervisor. Keycloak imports the same values (see the keycloak service), so the
      # supervisor can sign in. Core seeds them only when IsOptionalDataSeeded is true (the Development default).
      # true deletes the Core business data, outbox, and inbox, and seeds again on every start.
      Seeding__DevelopmentData__IsRecreationForced: ${HEALTHYFAC_SEED_RECREATE:-false}
      Seeding__DevelopmentData__TestTenant__CompanyId: ${HEALTHYFAC_TEST_COMPANY_ID:?set HEALTHYFAC_TEST_COMPANY_ID in .env}
      Seeding__DevelopmentData__TestTenant__SupervisorIdentityId: ${HEALTHYFAC_TEST_SUPERVISOR_IDENTITY_ID:?set HEALTHYFAC_TEST_SUPERVISOR_IDENTITY_ID in .env}
      Seeding__DevelopmentData__TestTenant__SupervisorEmployeeId: ${HEALTHYFAC_TEST_SUPERVISOR_EMPLOYEE_ID:?set HEALTHYFAC_TEST_SUPERVISOR_EMPLOYEE_ID in .env}
      Seeding__DevelopmentData__TestTenant__SupervisorEmail: ${HEALTHYFAC_TEST_SUPERVISOR_EMAIL:?set HEALTHYFAC_TEST_SUPERVISOR_EMAIL in .env}
      Proxy__KnownNetworks__0: 172.16.0.0/12
      Tracing__Endpoint: http://lgtm:4317
      Metrics__Endpoint: http://lgtm:4317
      OpenTelemetryLogging__Endpoint: http://lgtm:4318/v1/logs
    # The health port (8090 in the container) is internal. It binds to the loopback address of the host, so only
    # this machine reaches it. The container port equals HealthEndpoints:Port in appsettings.json.
    ports:
      - "${CORE_PORT:-8080}:8080"
      - "127.0.0.1:${CORE_HEALTH_PORT:-8091}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      lgtm:
        condition: service_healthy

  # The job hashes the passwords of .env into the data volume and gives the volume to the broker user, then it exits.
  mosquitto-init:
    container_name: healthyfac-mosquitto-init
    image: eclipse-mosquitto:2.1.2-alpine
    restart: "no"
    user: "0:0"
    read_only: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rm -f /mosquitto/data/passwords
        && mosquitto_passwd -b -c /mosquitto/data/passwords telemetry "$$MOSQUITTO_TELEMETRY_PASSWORD"
        && mosquitto_passwd -b /mosquitto/data/passwords sender "$$MOSQUITTO_SENDER_PASSWORD"
        && chown -R 1883:1883 /mosquitto/data
        && chmod 0600 /mosquitto/data/passwords
    environment:
      MOSQUITTO_TELEMETRY_PASSWORD: ${MOSQUITTO_TELEMETRY_PASSWORD:?set MOSQUITTO_TELEMETRY_PASSWORD in .env}
      MOSQUITTO_SENDER_PASSWORD: ${MOSQUITTO_SENDER_PASSWORD:?set MOSQUITTO_SENDER_PASSWORD in .env}
    volumes:
      - mosquitto-data:/mosquitto/data

  # The broker for the machine messages. It is separate from RabbitMQ, so a flooding sender cannot slow down the
  # business messages, and a device never gets the credentials of the internal broker.
  mosquitto:
    container_name: healthyfac-mosquitto
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    user: "1883:1883"
    read_only: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully

  telemetry:
    container_name: healthyfac-telemetry
    build:
      context: ./backend
      dockerfile: src/Telemetry/HealthyFac.Telemetry.Web/Dockerfile
    image: healthyfac/telemetry:local
    restart: unless-stopped
    read_only: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - telemetry-logs:/app/logs
      # The seed data file (seed machines). Telemetry reads it in Development only.
      - ./backend/seed:/app/seed:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: >-
        Host=postgres;Port=5432;Database=healthyfac_telemetry;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # The SPA sends the encrypted machine ID, so the keys equal the keys of Core.
      IdEncryption__Keys__0__Prefix: ${IdEncryption__Keys__0__Prefix:-v1.}
      IdEncryption__Keys__0__Key: ${IdEncryption__Keys__0__Key:?set IdEncryption__Keys__0__Key in .env}
      IdEncryption__Keys__0__IsDefault: "true"
      ConnectionStrings__RabbitMq: >-
        amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      Messaging__QueueName: telemetry
      # The issuer is the public URL of the realm (the gateway). Telemetry reads the metadata and the signing keys
      # from the internal address of Keycloak.
      Jwt__Issuer: ${HEALTHYFAC_AUTH_URL:-https://auth.healthyfac.test}/realms/healthyfac
      Jwt__MetadataAddress: http://keycloak:8080/realms/healthyfac/.well-known/openid-configuration
      Jwt__IsHttpsMetadataRequired: "false"
      MqttIntake__IsEnabled: "true"
      MqttIntake__Host: mosquitto
      MqttIntake__Username: telemetry
      MqttIntake__Password: ${MOSQUITTO_TELEMETRY_PASSWORD:?set MOSQUITTO_TELEMETRY_PASSWORD in .env}
      MqttIntake__ClientId: telemetry
      MqttIntake__ConsumerCount: "2"
      # The test company ID of Core. The seed machines of the seed data file belong to this company.
      Seeding__DevelopmentData__TestTenant__CompanyId: ${HEALTHYFAC_TEST_COMPANY_ID:?set HEALTHYFAC_TEST_COMPANY_ID in .env}
      Proxy__KnownNetworks__0: 172.16.0.0/12
      Tracing__Endpoint: http://lgtm:4317
      Metrics__Endpoint: http://lgtm:4317
      OpenTelemetryLogging__Endpoint: http://lgtm:4318/v1/logs
    # The health port (8090 in the container) is internal. It binds to the loopback address of the host.
    ports:
      - "${TELEMETRY_PORT:-8083}:8080"
      - "127.0.0.1:${TELEMETRY_HEALTH_PORT:-8094}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      lgtm:
        condition: service_healthy

  auth:
    container_name: healthyfac-auth
    build:
      context: ./backend
      dockerfile: src/Auth/HealthyFac.Auth.Web/Dockerfile
    image: healthyfac/auth:local
    restart: unless-stopped
    read_only: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - auth-logs:/app/logs
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: >-
        Host=postgres;Port=5432;Database=healthyfac_auth;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: >-
        amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      Messaging__QueueName: auth
      # Auth calls the Keycloak admin API and the token endpoint on the internal address. The set-password link
      # returns to the web app.
      KeycloakAdmin__BaseAddress: http://keycloak:8080
      KeycloakAdmin__Realm: healthyfac
      KeycloakAdmin__SpaClientId: healthyfac-spa
      KeycloakAdmin__SpaBaseUrl: ${HEALTHYFAC_SPA_URL:-https://app.healthyfac.test:4200}
      ServiceTokens__TokenEndpoint: http://keycloak:8080/realms/healthyfac/protocol/openid-connect/token
      ServiceTokens__ClientId: healthyfac-auth
      ServiceTokens__ClientSecret: ${KEYCLOAK_AUTH_CLIENT_SECRET:?set KEYCLOAK_AUTH_CLIENT_SECRET in .env}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
      Tracing__Endpoint: http://lgtm:4317
      Metrics__Endpoint: http://lgtm:4317
      OpenTelemetryLogging__Endpoint: http://lgtm:4318/v1/logs
    # The service maps no endpoint. The health port (8090 in the container) is the only port, and it binds to the
    # loopback address of the host. The container port equals HealthEndpoints:Port in appsettings.json.
    ports:
      - "127.0.0.1:${AUTH_HEALTH_PORT:-8092}:8090"
    # Hard dependencies: the host does not start without the database and the subscriptions. The realm job must end
    # with exit code 0, so Auth never starts with a half-applied realm. Redis is soft: a failed call retries through the
    # inbox.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      lgtm:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      redis:
        condition: service_started

  spa:
    container_name: healthyfac-spa
    build:
      context: ./backend
      dockerfile: src/Spa/HealthyFac.Spa.Web/Dockerfile
      # The frontend folder is a named extra context, so the image build stays under the backend context.
      additional_contexts:
        frontend: ./frontend
    image: healthyfac/spa:local
    restart: unless-stopped
    read_only: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # The public URL of the API. The host sends it to the browser in /config.json and allows it in the CSP.
      Spa__ApiBaseUrl: ${HEALTHYFAC_API_URL:-https://api.healthyfac.test}
      # The public URL of Keycloak. The host sends it to the browser in /config.json and allows it in the CSP.
      Spa__AuthUrl: ${HEALTHYFAC_AUTH_URL:-https://auth.healthyfac.test}
      # The PrimeUI license key. The host sends it to the browser in /config.json; a change needs only a restart.
      Spa__PrimeUiLicenseKey: ${PRIMEUI_LICENSE_KEY:?set PRIMEUI_LICENSE_KEY in .env}
      Proxy__KnownNetworks__0: 172.16.0.0/12
      Tracing__Endpoint: http://lgtm:4317
      Metrics__Endpoint: http://lgtm:4317
      OpenTelemetryLogging__Endpoint: http://lgtm:4318/v1/logs
    # No public port: the gateway serves the app on app.<domain>. The health port binds to the loopback address.
    ports:
      - "127.0.0.1:${SPA_HEALTH_PORT:-8093}:8090"
    depends_on:
      lgtm:
        condition: service_healthy

  gateway:
    container_name: healthyfac-gateway
    build:
      context: ./backend
      dockerfile: src/Gateway/HealthyFac.Gateway.Web/Dockerfile
    image: healthyfac/gateway:local
    restart: unless-stopped
    read_only: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # The health port stays on HTTP. The public port serves HTTPS with the certificate from docker/certs.
      ASPNETCORE_HTTP_PORTS: "8090"
      ASPNETCORE_HTTPS_PORTS: "8443"
      Kestrel__Certificates__Default__Path: /certs/healthyfac.test.pem
      Kestrel__Certificates__Default__KeyPath: /certs/healthyfac.test-key.pem
      ReverseProxy__Clusters__core__Destinations__main__Address: http://core:8080/
      # The active health check of the cluster calls the health port of Core, not the API port.
      ReverseProxy__Clusters__core__Destinations__main__Health: http://core:8090/
      ReverseProxy__Clusters__telemetry__Destinations__main__Address: http://telemetry:8080/
      ReverseProxy__Clusters__telemetry__Destinations__main__Health: http://telemetry:8090/
      ReverseProxy__Clusters__keycloak__Destinations__main__Address: http://keycloak:8080/
      ReverseProxy__Clusters__spa__Destinations__main__Address: http://spa:8080/
      ReverseProxy__Clusters__spa__Destinations__main__Health: http://spa:8090/
      Jwt__Issuer: ${HEALTHYFAC_AUTH_URL:-https://auth.healthyfac.test}/realms/healthyfac
      Jwt__MetadataAddress: http://keycloak:8080/realms/healthyfac/.well-known/openid-configuration
      Jwt__IsHttpsMetadataRequired: "false"
      Cors__AllowedOrigins__0: ${HEALTHYFAC_SPA_URL:-https://app.healthyfac.test:4200}
      # Each public route answers one logical name. A host without a port matches every port.
      ReverseProxy__Routes__core__Match__Hosts__0: api.${HEALTHYFAC_DOMAIN:-healthyfac.test}
      ReverseProxy__Routes__core-invite-public__Match__Hosts__0: api.${HEALTHYFAC_DOMAIN:-healthyfac.test}
      ReverseProxy__Routes__telemetry__Match__Hosts__0: api.${HEALTHYFAC_DOMAIN:-healthyfac.test}
      ReverseProxy__Routes__keycloak-token__Match__Hosts__0: auth.${HEALTHYFAC_DOMAIN:-healthyfac.test}
      ReverseProxy__Routes__keycloak-realm__Match__Hosts__0: auth.${HEALTHYFAC_DOMAIN:-healthyfac.test}
      ReverseProxy__Routes__keycloak-resources__Match__Hosts__0: auth.${HEALTHYFAC_DOMAIN:-healthyfac.test}
      ReverseProxy__Routes__spa__Match__Hosts__0: app.${HEALTHYFAC_DOMAIN:-healthyfac.test}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
      Proxy__KnownNetworks__0: 172.16.0.0/12
      Tracing__Endpoint: http://lgtm:4317
      Metrics__Endpoint: http://lgtm:4317
      OpenTelemetryLogging__Endpoint: http://lgtm:4318/v1/logs
    # The public port is HTTPS only; plain HTTP is not published. The health port (8090 in the container) is
    # internal and binds to the loopback address of the host.
    ports:
      - "${GATEWAY_PORT:-443}:8443"
      - "127.0.0.1:${GATEWAY_HEALTH_PORT:-8090}:8090"
    # The certificate and the key come from a local certificate authority (docker/certs/README.md). Git ignores
    # them, and the image does not hold them.
    volumes:
      - ./docker/certs:/certs:ro
    # Redis, Core, and the SPA host are soft dependencies of the gateway: it serves with a local limiter and
    # answers 503 for Core or the SPA host alone. It reads the signing keys of Keycloak at the first token. The realm job
    # runs only after a healthy Keycloak, so its success also covers the Keycloak routes.
    depends_on:
      core:
        condition: service_started
      telemetry:
        condition: service_started
      spa:
        condition: service_started
      keycloak-config:
        condition: service_completed_successfully
      redis:
        condition: service_started
      lgtm:
        condition: service_healthy

  lgtm:
    container_name: healthyfac-lgtm
    image: grafana/otel-lgtm:0.36.0
    restart: unless-stopped
    # The image defines no non-root user. This is a local-only tool, so it keeps the default user.
    # Test a non-root user before you change it, because the /data volume must stay writable.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
  rabbitmq-data:
  lgtm-data:
  core-logs:
  mosquitto-data:
  telemetry-logs:
  auth-logs:
  mailpit-data:
