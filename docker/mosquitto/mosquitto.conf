# Mosquitto for the machine messages. Telemetry reads them, a sender (a gateway or a test) writes them.
# The topic is the only identity of a machine: healthyfac/gateways/<gatewayId>/messages.
listener 1883
allow_anonymous false

# The mosquitto-init job writes the password file into the data volume from the passwords in .env.
password_file /mosquitto/data/passwords
acl_file /mosquitto/config/acl

# A bigger message is refused. Telemetry stores the raw message, so the limit also bounds the row size.
max_packet_size 65536

persistence true
persistence_location /mosquitto/data/

# The broker queues the messages of an offline persistent session (the Telemetry consumers). The default of 1000
# messages drops messages long before the session expires. The two limits bound the broker memory per session:
# a session over a limit loses its new messages.
max_queued_messages 100000
max_queued_bytes 104857600
