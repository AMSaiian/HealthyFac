@let url = kcContext.url;

<ng-template #headerNode>{{ i18n.msgStr('pageExpiredTitle') }}</ng-template>

<div class="flex flex-col gap-4">
  <div class="flex flex-col gap-2">
    <p
      id="instruction1"
      class="text-surface-700"
    >
      {{ i18n.msgStr('pageExpiredMsg1') }}
    </p>
    <a
      pButton
      id="loginRestartLink"
      class="w-full"
      severity="secondary"
      [href]="url.loginRestartFlowUrl"
      >{{ i18n.msgStr('restartLoginTooltip') }}</a
    >
  </div>
  <div class="flex flex-col gap-2">
    <p
      id="instruction2"
      class="text-surface-700"
    >
      {{ i18n.msgStr('pageExpiredMsg2') }}
    </p>
    <a
      pButton
      id="loginContinueLink"
      class="w-full"
      [href]="url.loginAction"
      >{{ i18n.msgStr('proceed') }}</a
    >
  </div>
</div>
