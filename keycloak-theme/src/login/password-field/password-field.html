<p-inputgroup>
  <input
    pInputPassword
    [(mask)]="isMasked"
    [id]="inputId()"
    [name]="name()"
    [autocomplete]="autocomplete()"
    [required]="isRequired()"
    [invalid]="isInvalid()"
  />
  <p-inputgroup-addon>
    <button
      pButton
      iconOnly
      type="button"
      severity="secondary"
      [text]="true"
      [attr.aria-controls]="inputId()"
      [attr.aria-label]="toggleLabel()"
      [pTooltip]="toggleLabel()"
      (click)="isMasked.set(!isMasked())"
    >
      <i
        class="pi"
        aria-hidden="true"
        [class.pi-eye]="isMasked()"
        [class.pi-eye-slash]="!isMasked()"
      ></i>
    </button>
  </p-inputgroup-addon>
</p-inputgroup>
